{% extends 'base.html' %}
{% block title %}Login · Scrapify{% endblock %}
{% block content %}
<section class="auth-shell">
  <div class="form-card">
    <div class="auth-title"><span class="eyebrow">Welcome back</span><h1>Log in to Scrapify</h1><p class="muted">Access your marketplace dashboard and bookings.</p></div>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Log in</button>
    </form>
    <p class="muted">New to Scrapify? <a href="{% url 'register' %}">Create an account</a>.</p>
  </div>
</section>
{% endblock %}

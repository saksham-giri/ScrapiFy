{% extends 'base.html' %}
{% block content %}
<h1>Delete Listing</h1>
<p>Are you sure you want to delete <strong>{{ listing.title }}</strong>?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Yes, delete</button>
    <a href="{% url 'seller_dashboard' %}">Cancel</a>
</form>
{% endblock %}

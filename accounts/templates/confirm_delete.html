{% extends 'base.html' %}
{% block title %}Delete Listing · Scrapify{% endblock %}
{% block content %}
<div class="form-card" style="max-width:560px;text-align:center"><span class="eyebrow">Seller tools</span><h1>Delete this listing?</h1><p class="muted">You are about to permanently remove <strong>{{ listing.title }}</strong> from your marketplace inventory.</p><form method="post" data-confirm="Delete this listing permanently?">{% csrf_token %}<div class="actions" style="justify-content:center"><button class="btn danger" type="submit">Yes, delete</button><a class="btn secondary" href="{% url 'seller_dashboard' %}">Cancel</a></div></form></div>
{% endblock %}

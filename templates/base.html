<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Scrapify{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; display: flex; flex-direction: column; min-height: 100vh; }
        header, footer { background: #1a1a24; color: #fff; padding: 1rem; }
        .navbar { display: flex; justify-content: space-between; max-width: 1200px; margin: 0 auto; }
        .nav-links { display: flex; gap: 1rem; list-style: none; }
        main { flex: 1; max-width: 1200px; margin: 0 auto; padding: 2rem; width: 100%; }
        footer { text-align: center; margin-top: auto; }
    </style>
    {% block head %}
    
    {% endblock %}
</head>
<body>
    <header>
        <nav class="navbar">
            <div>Logo</div>
            <ul class="nav-links">
                <li>Home</li>
                <li>About</li>
                <li><a href="{%url 'register' %}">Login/Signup</a></li>
                <li><a href="{%url 'logout' %}">Logout</a></li>
            </ul>
        </nav>
    </header>

    <main>
        
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; Scrapify </p>
    </footer>
</body>
</html>

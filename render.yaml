services:
  - type: web
    name: scrapify
    runtime: python
    buildCommand: "bash build.sh"
    startCommand: "gunicorn Scrapify.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: DATABASE_URL
        fromDatabase:
          name: scrapify-db
          property: connectionString

databases:
  - name: scrapify-db
    plan: free

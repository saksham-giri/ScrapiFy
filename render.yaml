services:
  - type: web
    name: scrapify
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn Scrapify.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: DATABASE_URL
        fromDatabase:
          name: scrapify-db
          property: connectionString
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://scrapify.onrender.com"

databases:
  - name: scrapify-db
    plan: free
